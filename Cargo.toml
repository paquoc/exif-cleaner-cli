[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/src-tauri"]
default-members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
exif-cleaner-core = { path = "crates/core" }
thiserror = "2"
roxmltree = "0.20"
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
