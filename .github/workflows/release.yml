# Builds Exif Cleaner PSD for Windows when a version tag is pushed (git tag v1.0.0 && git push --tags)
# and publishes a GitHub release with the installer, the portable app and the CLI.
# Run it by hand (Actions > Release > Run workflow) to build without publishing; the files are then
# attached to the run as artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in Cargo.toml
        if: env.IS_TAG == 'true'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Test
        run: cargo test --locked -p exif-cleaner-core

      - name: Build CLI
        shell: bash
        run: |
          cargo build --release --locked -p exif-cleaner
          mkdir -p dist-cli
          cp target/release/exif-cleaner.exe "dist-cli/exif-cleaner-${GITHUB_REF_NAME}-windows-x64.exe"

      - name: Build app (and publish the release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ env.IS_TAG == 'true' && github.ref_name || '' }}
          releaseName: Exif Cleaner PSD ${{ github.ref_name }}
          releaseBody: |
            Removes `photoshop:DocumentAncestors` from PSD/PSB files and every nested PSD/PSB smart object, without Photoshop.

            - **Exif.Cleaner.PSD_*_x64-setup.exe**: Windows installer for the app.
            - **exif-cleaner-*-windows-x64.exe**: command-line tool (`exif-cleaner --help`).
          releaseDraft: false
          prerelease: false

      - name: Attach the CLI and the portable app to the release
        if: env.IS_TAG == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/release/exif-cleaner-psd.exe "dist-cli/exif-cleaner-psd-${GITHUB_REF_NAME}-portable-x64.exe"
          gh release upload "$GITHUB_REF_NAME" dist-cli/*.exe --clobber

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: exif-cleaner-psd-${{ github.ref_name }}-windows
          path: |
            dist-cli/*.exe
            target/release/exif-cleaner-psd.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
